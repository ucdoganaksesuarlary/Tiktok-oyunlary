<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM vs TR - Battle Arena</title>
    <style>
        body { 
            margin: 0; 
            background-color: #0b0c10; 
            overflow: hidden; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }
        canvas { 
            display: block; 
            background: #0d0e15;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }
        .team-score {
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 5px 15px;
            border-radius: 10px;
        }
        #tm-score { color: #00ffaa; border: 1px solid #00ffaa; }
        #tr-score { color: #ff3366; border: 1px solid #ff3366; }
        #vs-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }
        .gift-hint { font-size: 11px; color: #ccc; margin-top: 3px; }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div id="tm-score" class="team-score">TM: 100%</div>
        <div id="vs-box">
            GÖNI EFIR ÝARYŞY
            <div class="gift-hint">TM [Rose 🌹] vs TR [Balloon 🎈]</div>
        </div>
        <div id="tr-score" class="team-score">TR: 100%</div>
    </div>
    
    <canvas id="battleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('battleCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let tmHP = 100;
        let trHP = 100;

        let players = []; 
        let bullets = [];
        let particles = [];

        function drawBackground() {
            // Neon we çyzyk dizaýnlary
            ctx.fillStyle = '#0f101b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function updateUI() {
            document.getElementById('tm-score').innerText = `TM: ${Math.floor(tmHP)}%`;
            document.getElementById('tr-score').innerText = `TR: ${Math.floor(trHP)}%`;
        }

        // Owadan Neon Team Şarikleri (1-nji suratdaky ýaly)
        function drawTeamBase(x, y, radius, team, username) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            
            // Içiniň reňki
            ctx.fillStyle = team === 'TM' ? 'rgba(0, 255, 170, 0.2)' : 'rgba(255, 51, 102, 0.2)';
            ctx.fill();
            
            // Neon ramkasy
            ctx.strokeStyle = team === 'TM' ? '#00ffaa' : '#ff3366';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.stroke();
            ctx.restore();
            ctx.shadowBlur = 0;

            // Ýazgysy
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(username, x, y + 4);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function spawnPlayer(team, username, count) {
            const sideX = team === 'TM' ? 70 : canvas.width - 70;
            const randomY = 150 + Math.random() * (canvas.height - 250);
            
            players.push({
                x: sideX,
                y: randomY,
                radius: 25,
                team: team,
                username: username,
                timer: 200 // Ekrandan öçmez ýaly wagt
            });

            shoot(team, count, randomY);
        }

        function shoot(team, count, startY) {
            const startX = team === 'TM' ? 100 : canvas.width - 100;
            const direction = team === 'TM' ? 1 : -1;
            const color = team === 'TM' ? '#00ffaa' : '#ff3366';

            bullets.push({
                x: startX,
                y: startY,
                speed: 7 * direction,
                color: color,
                damage: count * 2,
                size: 8
            });
        }

        function gameLoop() {
            drawBackground();

            // Söwüşýän bazalary çyzmak (Esasy uly tegelekler)
            drawTeamBase(50, canvas.height/2, 40, 'TM', 'TM');
            drawTeamBase(canvas.width - 50, canvas.height/2, 40, 'TR', 'TR');

            // Ulanyjy şariklerini dolandyrmak
            for (let i = players.length - 1; i >= 0; i--) {
                let p = players[i];
                drawTeamBase(p.x, p.y, p.radius, p.team, p.username.substring(0,5));
                p.timer--;
                if(p.timer <= 0) players.splice(i, 1);
            }

            // Oklary süýşürmek
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.speed;

                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();

                if (b.speed > 0 && b.x >= canvas.width - 90) {
                    trHP = Math.max(0, trHP - b.damage);
                    createExplosion(b.x, b.y, b.color);
                    bullets.splice(i, 1);
                    updateUI();
                } else if (b.speed < 0 && b.x <= 90) {
                    tmHP = Math.max(0, tmHP - b.damage);
                    createExplosion(b.x, b.y, b.color);
                    bullets.splice(i, 1);
                    updateUI();
                }
            }

            // Bölejikleri dolandyrmak
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // --- TEST ETMEK ÜÇIN (Ekra basylanda ok atar) ---
        window.addEventListener('click', (e) => {
            if(e.clientX < canvas.width / 2) {
                spawnPlayer('TM', 'Test_TM', 1);
            } else {
                spawnPlayer('TR', 'Test_TR', 1);
            }
        });

        // Socket.io baglanyşygy
        try {
            const socket = io();
            socket.on('tiktok-gift', (data) => {
                spawnPlayer(data.team, data.user, data.count);
            });
        } catch(e) { console.log("Serwer garaşylýar..."); }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        gameLoop();
    </script>
</body>
</html>
